{% extends "base.html" %}

{% block content %}
<div class="row align-items-center mb-4">
    <div class="col-12">
        <h2 class="fw-bold text-dark"><i class="bi bi-person-badge text-primary"></i> Perfil Docente</h2>
        <p class="text-muted">Información administrativa de tu cuenta.</p>
    </div>
</div>

<div class="row">
    <div class="col-md-6 mx-auto">
        <div class="card shadow-sm border-0 rounded-4 text-center p-4">
            <div class="card-body">
                <i class="bi bi-person-circle display-1 text-primary opacity-75 mb-3"></i>
                <h3 class="fw-bold text-dark mt-2">{{ profesor.nombre }}</h3>
                
                <hr class="text-secondary my-4">
                
                <div class="d-flex justify-content-between align-items-center mb-3">
                    <span class="text-muted fw-bold">ID / Matrícula:</span>
                    <span class="badge bg-light text-dark fs-6 border">{{ profesor.id }}</span>
                </div>
                
                <div class="d-flex justify-content-between align-items-center mb-3">
                    <span class="text-muted fw-bold">Rol en Sistema:</span>
                    <span class="badge bg-success shadow-sm fs-6 px-3 rounded-pill">{{ profesor.rol }}</span>
                </div>
                
                <div class="d-flex justify-content-between align-items-center">
                    <span class="text-muted fw-bold">Cursos Dictados:</span>
                    <span class="badge bg-primary shadow-sm fs-6 px-3 rounded-pill">{{ profesor.courses_taught|length }} Asignaturas</span>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
