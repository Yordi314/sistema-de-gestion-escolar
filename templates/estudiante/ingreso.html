<!-- INGRESO ESTUDIANTE -->
{% extends "base.html" %}

{% block content %}
<div class="row justify-content-center mt-5">
    <div class="col-md-5">
        <div class="card shadow-sm border-primary">
            <div class="card-header bg-primary text-white">
                <h5 class="mb-0">Portal del Estudiante</h5>
            </div>
            <div class="card-body">
                <form method="POST" action="{{ url_for('estudiante_dashboard') }}">
                    <div class="mb-3">
                        <label class="form-label">Seleccione su Perfil Estudiantil</label>
                        <select name="student_id" class="form-select" required>
                            <option value="" disabled selected>Elige tu nombre...</option>
                            {% for est in estudiantes %}
                            <option value="{{ est.id }}">{{ est.name }} ({{ est.id }})</option>
                            {% endfor %}
                        </select>
                    </div>
                    <button type="submit" class="btn btn-primary w-100" {% if not estudiantes %}disabled{% endif
                        %}>Consultar Boletín</button>
                    {% if not estudiantes %}
                    <div class="form-text text-danger mt-2">No hay estudiantes matriculados en el sistema.</div>
                    {% endif %}
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
