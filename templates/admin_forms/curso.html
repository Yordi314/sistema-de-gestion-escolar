{% extends "base.html" %}

{% block content %}
<div class="row justify-content-center mt-4">
    <div class="col-md-6">
        <div class="card shadow-sm">
            <div class="card-header bg-primary text-white">
                <h4 class="mb-0">📚 Crear Nuevo Curso</h4>
            </div>
            <div class="card-body">
                <form method="POST" action="{{ url_for('crear_curso') }}">
                    <div class="mb-3">
                        <label class="form-label">Código del Curso</label>
                        <input type="text" name="cid" class="form-control" required placeholder="Ej: MAT-101">
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Nombre del Curso</label>
                        <input type="text" name="nombre" class="form-control" required placeholder="Álgebra Lineal">
                    </div>
                    <div class="mb-4">
                        <label class="form-label">Profesor Asignado</label>
                        <select name="prof_id" class="form-select" required>
                            <option value="" disabled selected>Seleccione un profesor impartidor...</option>
                            {% for prof in profesores %}
                            <option value="{{ prof.id }}">{{ prof.name }} ({{ prof.id }})</option>
                            {% endfor %}
                        </select>
                        {% if not profesores %}
                        <small class="text-danger">⚠️ Debe dar de alta al menos un Profesor antes de crear un
                            curso.</small>
                        {% endif %}
                    </div>
                    <div class="d-flex justify-content-between">
                        <a href="{{ url_for('admin_dashboard') }}"
                            class="btn btn-outline-warning text-dark">Cancelar</a>
                        <button type="submit" class="btn btn-primary" {% if not profesores %}disabled{% endif %}>Crear
                            Curso</button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
