{% extends "base.html" %}

{% block content %}
<div class="row mt-5 align-items-center justify-content-center" style="min-height: 70vh;">
    <div class="col-md-5 mx-auto p-5 bg-white rounded-4 shadow-lg border-top border-5 border-primary">
        <div class="text-center mb-4">
            <img src="{{ url_for('static', filename='img/logo.png') }}?v=1.2" alt="Escudo del Colegio" width="100"
                height="100" class="img-fluid mb-3" style="object-fit: contain;">
            <h2 class="fw-bold text-dark mb-1">Iniciar Sesión</h2>
            <p class="text-muted">Colegio San Ignacio</p>
        </div>
        <form method="POST" action="{{ url_for('index') }}">
            <div class="mb-3">
                <label class="form-label text-muted fw-bold">ID / Matrícula / Cédula</label>
                <div class="input-group">
                    <span class="input-group-text bg-light"><i class="bi bi-person"></i></span>
                    <input type="text" name="uid" class="form-control form-control-lg" required placeholder="Ej: EST-01" autofocus>
                </div>
            </div>
            <div class="mb-4">
                <label class="form-label text-muted fw-bold">Contraseña</label>
                <div class="input-group">
                    <span class="input-group-text bg-light"><i class="bi bi-key"></i></span>
                    <input type="password" name="password" class="form-control form-control-lg" required placeholder="••••••••">
                </div>
            </div>
            <div class="d-grid">
                <button type="submit" class="btn btn-primary btn-lg rounded-pill shadow-sm">Acceder al Portal</button>
            </div>
        </form>
    </div>
</div>
{% endblock %}
