{% extends "base.html" %}

{% block content %}
<div class="row min-vh-100 align-items-center justify-content-center" style="margin-top: -80px;">
    <!-- Contenedor central flotante -->
    <div class="col-12 col-md-8 col-lg-6 col-xl-5">
        <div class="card border-0 shadow-lg fade-in-section bg-white" style="border-radius: 1.5rem; overflow: hidden;">
            <div class="card-body p-5">
                
                <!-- Encabezado / Logo Centrado -->
                <div class="text-center mb-5">
                    <img src="{{ url_for('static', filename='img/logo.png') }}?v=1.2" alt="Escudo del Colegio" class="img-fluid mb-3" style="max-height: 100px;">
                    <h4 class="fw-bold text-primary mb-1">Colegio San Ignacio</h4>
                    <p class="text-muted small fw-bold">Sistema de Gestión Académica</p>
                </div>
                
                <!-- Zona Formulario -->
                <form method="POST" action="{{ url_for('index') }}">
                    <div class="mb-4">
                        <label class="form-label text-muted fw-bold small text-uppercase" style="letter-spacing: 0.05em;">Matrícula o Cédula</label>
                        <div class="input-group">
                            <span class="input-group-text bg-light border-end-0 text-muted px-3"><i class="bi bi-person"></i></span>
                            <input type="text" name="uid" class="form-control form-control-lg bg-light border-start-0 shadow-none" required placeholder="Ej: EST-01" autofocus>
                        </div>
                    </div>
                    <div class="mb-5">
                        <label class="form-label text-muted fw-bold small text-uppercase" style="letter-spacing: 0.05em;">Contraseña Escolar</label>
                        <div class="input-group">
                            <span class="input-group-text bg-light border-end-0 text-muted px-3"><i class="bi bi-key"></i></span>
                            <input type="password" name="password" class="form-control form-control-lg bg-light border-start-0 shadow-none" required placeholder="••••••••">
                        </div>
                    </div>
                    <div class="d-grid mt-2">
                        <button type="submit" class="btn btn-primary btn-lg rounded-pill shadow-sm fw-bold d-flex align-items-center justify-content-center gap-2">
                            Ingresar al Portal <i class="bi bi-box-arrow-in-right"></i>
                        </button>
                    </div>
                </form>

            </div>
        </div>
    </div>
</div>
{% endblock %}
